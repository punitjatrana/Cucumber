name: Selenium Java CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to run"
        required: true
        default: "master"
        type: string

      environment:
        description: "Target environment"
        required: true
        default: "qa"
        type: choice
        options:
          - dev
          - qa
          - uat
          - staging
          - prod

      region:
        description: "Deployment region"
        required: true
        default: "ap-south-1"
        type: choice
        options:
          - ap-south-1
          - ap-southeast-1
          - us-east-1
          - us-west-2
          - eu-west-1

      git_tag:
        description: "Git tag (Optional)"
        required: false
        type: string

      release_tag:
        description: "Release tag (Optional, e.g. v1.0.0)"
        required: false
        type: string

      test_suite:
        description: "Test suite"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - full

      browser:
        description: "Browser"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: "Run browser in headless mode"
        required: true
        default: true
        type: boolean

      java_version:
        description: "Java Version"
        required: true
        default: "17"
        type: choice
        options:
          - "11"
          - "17"
          - "21"

  workflow_call:
    inputs:
      branch:
        required: true
        type: string

      environment:
        required: false
        type: string

      region:
        required: false
        type: string

      git_tag:
        required: false
        type: string

      release_tag:
        required: false
        type: string

      test_suite:
        required: false
        type: string

      browser:
        required: false
        default: "chrome"
        type: string

      headless:
        required: false
        default: true
        type: boolean

      java_version:
        required: false
        default: "17"
        type: string

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}
          cache: maven

      - name: Display Selected Inputs
        run: |
          echo "Branch       : ${{ inputs.branch }}"
          echo "Environment  : ${{ inputs.environment }}"
          echo "Region       : ${{ inputs.region }}"
          echo "Git Tag      : ${{ inputs.git_tag }}"
          echo "Release Tag  : ${{ inputs.release_tag }}"
          echo "Test Suite   : ${{ inputs.test_suite }}"
          echo "Browser      : ${{ inputs.browser }}"
          echo "Headless     : ${{ inputs.headless }}"
          echo "Java Version : ${{ inputs.java_version }}"

      - name: Build and Run Tests
        run: mvn clean test