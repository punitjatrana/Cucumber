name: Selenium Java CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the workflow"
        required: true
        default: "master"
        type: string

      environment:
        description: "Target environment (Optional)"
        required: false
        default: "qa"
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod

      test_suite:
        description: "Test suite to execute"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - full

      browser:
        description: "Browser"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: "Run browser in headless mode"
        required: true
        default: true
        type: boolean

      java_version:
        description: "Java Version"
        required: true
        default: "17"
        type: choice
        options:
          - "11"
          - "17"
          - "21"

      release_tag:
        description: "Release Tag (Optional)"
        required: false
        type: string

  workflow_call:
    inputs:
      branch:
        required: true
        type: string

      environment:
        required: false
        type: string

      test_suite:
        required: true
        type: string

      browser:
        required: false
        default: "chrome"
        type: string

      headless:
        required: false
        default: true
        type: boolean

      java_version:
        required: false
        default: "17"
        type: string

      release_tag:
        required: false
        type: string

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}
          cache: maven

      - name: Build and Run Tests
        run: mvn clean test